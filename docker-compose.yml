services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: meshboard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meshboard
      POSTGRES_USER: meshboard
      POSTGRES_PASSWORD: dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
